name: "Stash API"
description: "Official plugin API for Stash"
version: "1.4.6"

ui:
  javascript:
    - app.js
  assets:
    /: assets
    /state: .
  csp:
    connect-src:
      - http://localhost:*

exec:
  - powershell
  - "-ExecutionPolicy"
  - "Bypass"
  - "-File"
  - "{pluginDir}/bootstrap.ps1"

interface: raw
errLog: none
